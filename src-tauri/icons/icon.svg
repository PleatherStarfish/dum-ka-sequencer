<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Restrained vertical drift on the indigo plate: depth, not decoration. -->
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2c58"/>
      <stop offset="1" stop-color="#111d42"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186" ry="186"/>
    </clipPath>
    <!-- Punch the chart lines out behind the star nodes. -->
    <mask id="node-gaps">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <circle cx="282" cy="705" r="30" fill="#000"/>
      <circle cx="667.6" cy="621" r="17" fill="#000"/>
    </mask>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Plate -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#plate)"/>
  </g>

  <g clip-path="url(#squircle)">
    <g mask="url(#node-gaps)" stroke="#fff4e5" fill="none">
      <!-- throne: suspension ring + stub -->
      <circle cx="512" cy="178" r="26" stroke-width="10" stroke-opacity="0.92"/>
      <line x1="512" y1="201" x2="512" y2="214" stroke-width="11"
            stroke-opacity="0.92" stroke-linecap="round"/>

      <!-- mater limb: graduated outer ring -->
      <circle cx="512" cy="512" r="300" stroke-width="8" stroke-opacity="0.92"/>
      <circle cx="512" cy="512" r="287" stroke-width="18" stroke-opacity="0.36"
              stroke-dasharray="3.6 21.44"/>
      <circle cx="512" cy="512" r="284" stroke-width="30" stroke-opacity="0.62"
              stroke-dasharray="5 143.73" stroke-dashoffset="2.5"/>

      <!-- tympan equator: dotted -->
      <circle cx="512" cy="512" r="190" stroke-width="4.5" stroke-opacity="0.38"
              stroke-linecap="round" stroke-dasharray="0.1 16.58"/>

      <!-- rete ecliptic: the off-center ring, swung upper-left -->
      <circle cx="400" cy="406" r="112" stroke-width="8" stroke-opacity="0.9"/>
    </g>

    <!-- star nodes -->
    <circle cx="282" cy="705" r="15" fill="#fff4e5" fill-opacity="0.95"/>
    <circle cx="667.6" cy="621" r="8" fill="#fff4e5" fill-opacity="0.75"/>

    <!-- alidade: the sighting rule, the one signal accent -->
    <g transform="rotate(26 512 512)">
      <line x1="512" y1="250" x2="512" y2="774" stroke="#e11984"
            stroke-width="24" stroke-linecap="round"/>
    </g>
    <!-- axis pin -->
    <circle cx="512" cy="512" r="14" fill="#fff4e5"/>
    <circle cx="512" cy="512" r="5" fill="#15254d"/>
  </g>
</svg>
